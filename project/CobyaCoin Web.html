<style>
/* =============================================================
   CobyaCoin Design System — colors_and_type.css
   Apple HIG + iOS 26 Liquid Glass interpretation
   Dark-first, light-mode via [data-theme="light"]
   ============================================================= */

/* ---- Fonts -------------------------------------------------- */
/* SF Pro is Apple-licensed; we substitute Geist (Vercel) as the
   near-metric, simpler + bolder UI face. Mono uses JetBrains Mono.
   Swap to SF Pro / SF Mono on Apple platforms with licensing. */
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* =========================================================
     COLORS — base palette (oklch for perceptual consistency)
     ========================================================= */

  /* Brand */
  --cbc-amber-100: oklch(0.96 0.04 75);
  --cbc-amber-200: oklch(0.90 0.08 74);
  --cbc-amber-300: oklch(0.85 0.13 73);
  --cbc-amber-400: oklch(0.82 0.15 71);
  --cbc-amber-500: oklch(0.78 0.16 70);   /* primary */
  --cbc-amber-600: oklch(0.70 0.16 65);
  --cbc-amber-700: oklch(0.58 0.15 55);
  --cbc-amber-800: oklch(0.44 0.12 50);

  --maple-100:    oklch(0.94 0.04 30);
  --maple-200:    oklch(0.86 0.10 30);
  --maple-300:    oklch(0.76 0.16 30);
  --maple-400:    oklch(0.68 0.19 30);
  --maple-500:    oklch(0.60 0.20 30);    /* primary maple */
  --maple-600:    oklch(0.52 0.19 28);
  --maple-700:    oklch(0.42 0.16 26);
  --maple-800:    oklch(0.32 0.13 25);

  --reserve-100:  oklch(0.94 0.04 245);
  --reserve-300:  oklch(0.82 0.10 245);
  --reserve-500:  oklch(0.65 0.15 245);   /* iOS systemBlue */
  --reserve-700:  oklch(0.50 0.14 245);
  --reserve-800:  oklch(0.38 0.12 246);

  /* Neutrals — OLED-tuned cool grays */
  --gray-0:   #06070A;   /* canvas dark */
  --gray-1:   #0B0D12;
  --gray-2:   #121520;
  --gray-3:   #1A1E2A;
  --gray-4:   #242A38;
  --gray-5:   #343B4C;
  --gray-6:   #505868;
  --gray-7:   #727A8C;
  --gray-8:   #9AA2B4;
  --gray-9:   #C8CEDB;
  --gray-10:  #EEF0F5;
  --gray-11:  #FFFFFF;

  /* Semantic (iOS system colors, dark-mode versions) */
  --success-500: oklch(0.72 0.18 150);    /* systemGreen */
  --danger-500:  oklch(0.65 0.22 25);     /* systemRed */
  --warning-500: oklch(0.78 0.17 70);     /* systemOrange — same fam as CBC */
  --info-500:    var(--reserve-500);

  /* =========================================================
     SEMANTIC TOKENS (dark default)
     ========================================================= */

  /* Surfaces — solid underlays behind glass */
  --bg-canvas:     var(--gray-0);
  --bg-elevated:   var(--gray-2);
  --bg-sunken:     #000;

  /* Foregrounds */
  --fg-1:          var(--gray-11);          /* primary text */
  --fg-2:          var(--gray-9);           /* secondary */
  --fg-3:          var(--gray-8);           /* tertiary */
  --fg-4:          var(--gray-7);           /* quaternary, placeholder */
  --fg-on-amber:   #1A0F00;                 /* text on CBC amber */
  --fg-on-maple:   #FFFFFF;
  --fg-on-reserve: #FFFFFF;

  /* Strokes */
  --stroke-hairline: rgb(255 255 255 / .12);
  --stroke-strong:   rgb(255 255 255 / .22);
  --stroke-inset:    inset 0 0 0 1px var(--stroke-hairline);

  /* Tints (semantic) */
  --tint-primary:    var(--cbc-amber-500);
  --tint-accent:     var(--maple-500);
  --tint-reserve:    var(--reserve-500);
  --tint-success:    var(--success-500);
  --tint-danger:     var(--danger-500);
  --tint-warning:    var(--warning-500);

  /* =========================================================
     LIQUID GLASS MATERIALS
     ========================================================= */
  /* Three depth tiers — use the composite vars or compose by hand */
  --glass-thin-fill:     rgb(18 21 32 / .40);
  --glass-regular-fill:  rgb(18 21 32 / .55);
  --glass-thick-fill:    rgb(12 14 20 / .70);

  --glass-thin-blur:     saturate(160%) blur(20px);
  --glass-regular-blur:  saturate(180%) blur(30px);
  --glass-thick-blur:    saturate(200%) blur(40px);

  /* Tinted variants — overlay color washes over the fill */
  --glass-tint-amber:    rgb(245 184 65 / .16);
  --glass-tint-maple:    rgb(217 67 42 / .18);
  --glass-tint-reserve:  rgb(58 141 255 / .18);
  --glass-tint-success:  rgb(52 199 89 / .16);
  --glass-tint-danger:   rgb(255 69 58 / .16);

  /* Specular highlight (always-paired inset) */
  --glass-specular:      inset 0 1px 0 rgb(255 255 255 / .22);

  /* =========================================================
     SHADOWS
     ========================================================= */
  --shadow-1:    0 1px 2px rgb(0 0 0 / .24);
  --shadow-2:    0 8px 24px rgb(0 0 0 / .28), 0 1px 2px rgb(0 0 0 / .24);
  --shadow-3:    0 24px 60px rgb(0 0 0 / .45), 0 2px 8px rgb(0 0 0 / .28);
  --shadow-glow-cbc:    0 8px 32px rgb(245 184 65 / .28);
  --shadow-glow-maple:  0 8px 32px rgb(217 67 42 / .28);

  /* =========================================================
     RADII
     ========================================================= */
  --r-xs:   6px;   /* inline chips */
  --r-sm:  10px;   /* inputs */
  --r-md:  14px;   /* buttons */
  --r-lg:  22px;   /* cards */
  --r-xl:  28px;   /* sheets */
  --r-2xl: 36px;   /* hero cards */
  --r-pill: 999px;

  /* =========================================================
     SPACING — 4pt grid
     ========================================================= */
  --s-0: 0;
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-7: 28px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;
  --s-14: 56px;
  --s-16: 64px;
  --s-20: 80px;
  --s-24: 96px;

  /* =========================================================
     TYPOGRAPHY
     ========================================================= */
  --font-sans: 'SF Pro Display', 'Geist', -apple-system,
               BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-text: 'SF Pro Text', 'Geist', -apple-system, sans-serif;
  --font-mono: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular,
               Menlo, Consolas, monospace;

  /* Base scale — bolder + simpler than Apple default. Weight bumped +100. */
  --t-display-size:   64px;  --t-display-lh:   64px;  --t-display-weight: 800;
  --t-title1-size:    40px;  --t-title1-lh:    44px;  --t-title1-weight:  800;
  --t-title2-size:    30px;  --t-title2-lh:    34px;  --t-title2-weight:  700;
  --t-title3-size:    22px;  --t-title3-lh:    26px;  --t-title3-weight:  700;
  --t-headline-size:  17px;  --t-headline-lh:  22px;  --t-headline-weight:700;
  --t-body-size:      17px;  --t-body-lh:      24px;  --t-body-weight:    500;
  --t-callout-size:   16px;  --t-callout-lh:   22px;  --t-callout-weight: 500;
  --t-subhead-size:   14px;  --t-subhead-lh:   18px;  --t-subhead-weight: 600;
  --t-footnote-size:  13px;  --t-footnote-lh:  18px;  --t-footnote-weight:500;
  --t-caption-size:   11px;  --t-caption-lh:   14px;  --t-caption-weight: 600;

  /* Letter spacing — Apple tightens large display sizes */
  --t-tracking-display: -0.03em;
  --t-tracking-title:   -0.02em;
  --t-tracking-body:    -0.005em;
  --t-tracking-caps:     0.08em;

  /* =========================================================
     MOTION
     ========================================================= */
  --ease-smooth:  cubic-bezier(0.22, 1, 0.36, 1);   /* SwiftUI default */
  --ease-in-out:  cubic-bezier(0.45, 0, 0.55, 1);
  --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1); /* only for press-release bounce */
  --dur-fast:     120ms;
  --dur-base:     220ms;
  --dur-page:     320ms;
  --dur-sheet:    480ms;
  --dur-hero:     600ms;
}

/* ---- Light theme overrides --------------------------------- */
[data-theme="light"] {
  --bg-canvas:     #F2F3F7;
  --bg-elevated:   #FFFFFF;
  --bg-sunken:     #E7E9EF;

  --fg-1: #07080C;
  --fg-2: #2E3340;
  --fg-3: #5B6275;
  --fg-4: #8B92A5;

  --stroke-hairline: rgb(0 0 0 / .08);
  --stroke-strong:   rgb(0 0 0 / .14);
  --stroke-inset:    inset 0 0 0 1px var(--stroke-hairline);

  --glass-thin-fill:     rgb(255 255 255 / .55);
  --glass-regular-fill:  rgb(255 255 255 / .72);
  --glass-thick-fill:    rgb(255 255 255 / .85);

  --glass-specular:      inset 0 1px 0 rgb(255 255 255 / .80);

  --shadow-2: 0 8px 24px rgb(14 18 28 / .10), 0 1px 2px rgb(14 18 28 / .06);
  --shadow-3: 0 24px 60px rgb(14 18 28 / .18), 0 2px 8px rgb(14 18 28 / .08);
}

/* =============================================================
   SEMANTIC ELEMENT STYLES
   (so any html element can inherit Apple-tuned type + color
    without per-component styling)
   ============================================================= */

html, body {
  background: var(--bg-canvas);
  color: var(--fg-1);
  font-family: var(--font-sans);
  font-size: var(--t-body-size);
  line-height: var(--t-body-lh);
  letter-spacing: var(--t-tracking-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'ss01', 'cv11', 'calt';
}

h1, .t-title1 {
  font-size: var(--t-title1-size);
  line-height: var(--t-title1-lh);
  font-weight: var(--t-title1-weight);
  letter-spacing: var(--t-tracking-title);
  margin: 0;
}
h2, .t-title2 {
  font-size: var(--t-title2-size);
  line-height: var(--t-title2-lh);
  font-weight: var(--t-title2-weight);
  letter-spacing: var(--t-tracking-title);
  margin: 0;
}
h3, .t-title3 {
  font-size: var(--t-title3-size);
  line-height: var(--t-title3-lh);
  font-weight: var(--t-title3-weight);
  letter-spacing: var(--t-tracking-title);
  margin: 0;
}
.t-display {
  font-size: var(--t-display-size);
  line-height: var(--t-display-lh);
  font-weight: var(--t-display-weight);
  letter-spacing: var(--t-tracking-display);
}
.t-headline {
  font-size: var(--t-headline-size);
  line-height: var(--t-headline-lh);
  font-weight: var(--t-headline-weight);
}
.t-body  { font-size: var(--t-body-size);  line-height: var(--t-body-lh);  font-weight: var(--t-body-weight); }
.t-callout { font-size: var(--t-callout-size); line-height: var(--t-callout-lh); font-weight: var(--t-callout-weight); }
.t-subhead { font-size: var(--t-subhead-size); line-height: var(--t-subhead-lh); font-weight: var(--t-subhead-weight); }
.t-footnote, small { font-size: var(--t-footnote-size); line-height: var(--t-footnote-lh); font-weight: var(--t-footnote-weight); color: var(--fg-2); }
.t-caption  { font-size: var(--t-caption-size); line-height: var(--t-caption-lh); font-weight: var(--t-caption-weight); color: var(--fg-3); }

.t-ticker, code, kbd, samp, .t-mono {
  font-family: var(--font-mono);
  font-weight: 600;
  font-feature-settings: 'tnum', 'zero';
  letter-spacing: 0;
}

/* =============================================================
   GLASS UTILITIES — drop on any element
   ============================================================= */

.glass,
.glass-regular {
  background: var(--glass-regular-fill);
  backdrop-filter: var(--glass-regular-blur);
  -webkit-backdrop-filter: var(--glass-regular-blur);
  box-shadow: var(--stroke-inset), var(--glass-specular), var(--shadow-2);
  border-radius: var(--r-lg);
}
.glass-thin {
  background: var(--glass-thin-fill);
  backdrop-filter: var(--glass-thin-blur);
  -webkit-backdrop-filter: var(--glass-thin-blur);
  box-shadow: var(--stroke-inset), var(--glass-specular);
}
.glass-thick {
  background: var(--glass-thick-fill);
  backdrop-filter: var(--glass-thick-blur);
  -webkit-backdrop-filter: var(--glass-thick-blur);
  box-shadow: var(--stroke-inset), var(--glass-specular), var(--shadow-3);
  border-radius: var(--r-xl);
}

/* Tinted glass washes — add on top of a .glass* base */
.glass-tint-amber    { background: linear-gradient(var(--glass-tint-amber),   var(--glass-tint-amber)),   var(--glass-regular-fill); }
.glass-tint-maple    { background: linear-gradient(var(--glass-tint-maple),   var(--glass-tint-maple)),   var(--glass-regular-fill); }
.glass-tint-reserve  { background: linear-gradient(var(--glass-tint-reserve), var(--glass-tint-reserve)), var(--glass-regular-fill); }
.glass-tint-success  { background: linear-gradient(var(--glass-tint-success), var(--glass-tint-success)), var(--glass-regular-fill); }
.glass-tint-danger   { background: linear-gradient(var(--glass-tint-danger),  var(--glass-tint-danger)),  var(--glass-regular-fill); }

/* =============================================================
   BACKGROUND MESH — used as canvas behind glass
   ============================================================= */
.bg-mesh {
  background-color: var(--gray-0);
  background-image:
    radial-gradient(60% 50% at 15% 10%,  rgb(245 184 65 / .22) 0%, transparent 60%),
    radial-gradient(50% 40% at 85% 20%,  rgb(217 67 42 / .18) 0%, transparent 60%),
    radial-gradient(60% 50% at 70% 90%,  rgb(58 141 255 / .16) 0%, transparent 60%),
    radial-gradient(40% 30% at 10% 80%,  rgb(138 47 255 / .14) 0%, transparent 60%);
}

</style>
<style>

  body::before {
    content: ''; position: fixed; inset: -20%;
    background-image:
      radial-gradient(25% 20% at 20% 30%, rgb(245 184 65 / .18), transparent 60%),
      radial-gradient(30% 25% at 80% 70%, rgb(217 67 42 / .16), transparent 60%),
      radial-gradient(25% 20% at 60% 20%, rgb(58 141 255 / .14), transparent 60%);
    animation: meshDrift 40s ease-in-out infinite alternate;
    pointer-events: none; z-index: 0;
  }
  @keyframes meshDrift {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(4%, -3%) scale(1.05); }
    100% { transform: translate(-3%, 2%) scale(1); }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes coinSpin {
    from { transform: rotateY(0deg); } to { transform: rotateY(360deg); }
  }
  @keyframes gpuPulse {

    50% { box-shadow: inset 0 1px 0 #ffffff90, 0 0 18px #F5B841aa; }
  }
  @keyframes slide {
    from { background-position: 0 0; } to { background-position: 80px 0; }
  }
  @keyframes tickerScroll {
    from { transform: translateX(0); } to { transform: translateX(-50%); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }

  ::-webkit-scrollbar-thumb:hover { background: rgb(255 255 255 / .16); }
  ::-webkit-scrollbar-track { background: transparent; }

  input::placeholder { color: #727A8C; }
  button { font-family: inherit; }

  .app-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; position: relative; z-index: 1; }
  .ticker-strip {
    position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 20;
    background: rgb(6 7 10 / .85);
    backdrop-filter: saturate(180%) blur(30px);
    -webkit-backdrop-filter: saturate(180%) blur(30px);
    border-bottom: 1px solid rgb(255 255 255 / .06);
    overflow: hidden; display: flex; align-items: center;
  }
  .ticker-strip-inner {
    display: inline-flex; gap: 40px; white-space: nowrap;
    animation: tickerScroll 60s linear infinite;
    padding-left: 20px;
  }
</style>

    { rank: 3, user: '@Dan9kov', cbc: 180202, mpl: 1.8e6, tint: 'maple' },
    { rank: 4, user: '@unlucky_POvelitel', cbc: 128904, mpl: 1.3e6, tint: 'neutral' },
    { rank: 5, user: '@kamila', cbc: 118220, mpl: 1.1e6, tint: 'neutral' },
    { rank: 6, user: '@vlad_b', cbc: 98440, mpl: 980000, tint: 'neutral' },
    { rank: 7, user: '@anon_maple', cbc: 82110, mpl: 830000, tint: 'neutral' },
    { rank: 8, user: '@eva_k', cbc: 74222, mpl: 760000, tint: 'neutral' },
  ],
};

// ---------- store (singleton) ----------
let state = JSON.parse(JSON.stringify(initialState));
// restore from localStorage
try {
  const saved = JSON.parse(localStorage.getItem('cobya:state') || 'null');
  if (saved && saved.user) {
    state.user = { ...state.user, ...saved.user };
    state.mining = { ...state.mining, ...saved.mining };
    state.mining.lastTick = Date.now();
  }
} catch (e) {}

const listeners = new Set();
const notify = () => listeners.forEach((l) => l());
const getState = () => state;
const setState = (updater) => {
  const next = typeof updater === 'function' ? updater(state) : { ...state, ...updater };
  state = next;
  try {
    localStorage.setItem('cobya:state', JSON.stringify({ user: state.user, mining: state.mining }));
  } catch (e) {}
  notify();
};

const useStore = () => {
  const [, force] = useState(0);
  useEffect(() => {
    const l = () => force((x) => x + 1);
    listeners.add(l);
    return () => listeners.delete(l);
  }, []);
  return state;
};

// ---------- actions ----------
const actions = {
  placeOrder({ side, cbc, mpl }) {
    if (!cbc || !mpl) return { ok: false, err: 'Заполни объём и цену.' };
    const u = state.user;
    if (side === 'buy' && u.mpl < mpl) return { ok: false, err: '❌ Недостаточно MPL.' };
    if (side === 'sell' && u.cbc < cbc) return { ok: false, err: '❌ Недостаточно CBC.' };
    setState((s) => {
      const user = { ...s.user };
      if (side === 'buy') { user.mpl -= mpl; user.cbc += cbc; }
      else { user.cbc -= cbc; user.mpl += mpl; }
      user.trades += 1;
      const trade = {
        id: 't' + Date.now(),
        buyer: side === 'buy' ? s.user.handle : '@Reserve',
        seller: side === 'sell' ? s.user.handle : '@Reserve',
        cbc, mpl, ago: 'now',
      };
      const feed = [{ id: 'f' + Date.now(), emoji: '✅', text: `Ордер исполнен — ${side === 'buy' ? 'куплено' : 'продано'} ${cbc} CBC за ${nf(mpl)} MPL.`, ago: 'now' }, ...s.feed].slice(0, 20);
      // nudge price
      const impact = (cbc / 400) * (side === 'buy' ? 1 : -1);
      const newPrice = clamp(s.price + impact, 60, 180);
      return { ...s, user, trades: [trade, ...s.trades].slice(0, 12), feed, price: newPrice, prevPrice: s.price };
    });
    return { ok: true };
  },

  buyGpu() {
    const cost = 320;
    if (state.user.mpl < cost) return { ok: false, err: '❌ Недостаточно MPL.' };
    if (state.mining.gpus >= state.mining.maxGpus) return { ok: false, err: 'Улучши ферму.' };
    setState((s) => ({
      ...s,
      user: { ...s.user, mpl: s.user.mpl - cost },
      mining: { ...s.mining, gpus: s.mining.gpus + 1 },
      feed: [{ id: 'f' + Date.now(), emoji: '⛏', text: `Куплен GPU. Ферма: ${s.mining.gpus + 1}/${s.mining.maxGpus}.`, ago: 'now' }, ...s.feed].slice(0, 20),
    }));
    return { ok: true };
  },

  sellGpu() {
    if (state.mining.gpus <= 0) return { ok: false };
    setState((s) => ({
      ...s,
      user: { ...s.user, mpl: s.user.mpl + 180 },
      mining: { ...s.mining, gpus: s.mining.gpus - 1 },
    }));
    return { ok: true };
  },

  upgradeFarm() {
    const cost = state.mining.level * 1000;
    if (state.user.mpl < cost) return { ok: false, err: '❌ Недостаточно MPL.' };
    setState((s) => ({
      ...s,
      user: { ...s.user, mpl: s.user.mpl - cost },
      mining: { ...s.mining, level: s.mining.level + 1, maxGpus: s.mining.maxGpus + 10 },
      feed: [{ id: 'f' + Date.now(), emoji: '🛠', text: `Ферма повышена до lvl ${s.mining.level + 1}.`, ago: 'now' }, ...s.feed].slice(0, 20),
    }));
    return { ok: true };
  },

  collectMining() {
    const gained = state.mining.pending;
    if (gained <= 0) return { ok: false };
    setState((s) => ({
      ...s,
      user: { ...s.user, cbc: s.user.cbc + gained },
      mining: { ...s.mining, pending: 0 },
      feed: [{ id: 'f' + Date.now(), emoji: '💰', text: `Намайнено +${gained.toFixed(2)} CBC.`, ago: 'now' }, ...s.feed].slice(0, 20),
    }));
    return { ok: true, gained };
  },

  spinRoulette(bet, color) {
    if (state.user.mpl < bet) return { ok: false, err: '❌ Недостаточно MPL.' };
    if (state.casino.spinning) return { ok: false };
    setState((s) => ({ ...s, casino: { ...s.casino, spinning: true } }));
    const pockets = ['red', 'black', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'black', 'green'];
    const landed = choice(pockets);
    const wonMult = landed === color ? (color === 'green' ? 14 : 2) : 0;
    const payout = wonMult * bet;
    const rotations = 5 + Math.random() * 3;
    const pocketIdx = pockets.indexOf(landed);
    const finalAngle = rotations * 360 + (pocketIdx / pockets.length) * 360;
    setState((s) => ({ ...s, casino: { ...s.casino, wheelAngle: s.casino.wheelAngle + finalAngle } }));
    setTimeout(() => {
      setState((s) => ({
        ...s,
        user: { ...s.user, mpl: s.user.mpl - bet + payout },
        casino: {
          ...s.casino,
          spinning: false,
          lastRoll: { result: landed, color: landed, payout, bet, won: payout > 0 },
          jackpotMpl: payout > 0 ? Math.max(50000, s.casino.jackpotMpl - payout * 0.4) : s.casino.jackpotMpl + bet * 0.3,
        },
        feed: [{
          id: 'f' + Date.now(),
          emoji: payout > 0 ? '🎰' : '❌',
          text: payout > 0 ? `Выигрыш +${nf(payout)} MPL (${landed}).` : `Выпало ${landed}. Ставка сгорела.`,
          ago: 'now',
        }, ...s.feed].slice(0, 20),
      }));
    }, 3200);
    return { ok: true };
  },

  bidAuction(id, delta = 500) {
    setState((s) => ({
      ...s,
      user: { ...s.user, mpl: s.user.mpl - (s.auction.find(a => a.id === id).bid + delta) + 0 },
      auction: s.auction.map(a => a.id === id ? { ...a, bid: a.bid + delta, by: s.user.handle } : a),
      feed: [{ id: 'f' + Date.now(), emoji: '📢', text: `Ставка повышена — ${s.auction.find(a => a.id === id).title}.`, ago: 'now' }, ...s.feed].slice(0, 20),
    }));
  },

  redeemPromo(code) {
    if (!code) return { ok: false };
    const bonus = code.toLowerCase() === 'cobya26' ? 50000 : 5000;
    setState((s) => ({
      ...s,
      user: { ...s.user, mpl: s.user.mpl + bonus },
      feed: [{ id: 'f' + Date.now(), emoji: '🎫', text: `Промокод активирован — +${nf(bonus)} MPL.`, ago: 'now' }, ...s.feed].slice(0, 20),
    }));
    return { ok: true, bonus };
  },
};

// ---------- ticker (global) ----------
let tickerStarted = false;
const startTicker = () => {
  if (tickerStarted) return;
  tickerStarted = true;
  setInterval(() => {
    setState((s) => {
      // price random walk
      const drift = rnd(-0.8, 0.85);
      let p = clamp(s.price + drift, 60, 180);
      // circuit breaker
      let circuit = s.circuit;
      if (circuit && Date.now() > circuit.until) circuit = null;
      const hist = [...s.history.slice(1), p];
      // mining accrual
      const now = Date.now();
      const dt = Math.min(5, (now - s.mining.lastTick) / 1000);
      const pending = s.mining.pending + s.mining.rate * s.mining.gpus * dt;
      // order book churn — occasional new listing
      let orderBook = s.orderBook;
      let trades = s.trades;
      if (Math.random() < 0.25) {
        const users = ['@kamila', '@IL76pd', '@vlad_b', '@anon_maple', '@Dan9kov', '@eva_k', '@unlucky_POvelitel'];
        const side = Math.random() > 0.5 ? 'buy' : 'sell';
        const cbc = Math.round(rnd(2, 60));
        const mpl = Math.round(cbc * p + rnd(-20, 20));
        orderBook = [{
          id: 'o' + now,
          side, user: choice(users), cbc, mpl,
          ago: 'just now',
        }, ...orderBook].slice(0, 10);
      }
      if (Math.random() < 0.15) {
        const users = ['@kamila', '@IL76pd', '@vlad_b', '@anon_maple'];
        const cbc = Math.round(rnd(2, 30));
        trades = [{
          id: 't' + now, buyer: choice(users), seller: choice(users), cbc,
          mpl: Math.round(cbc * p),
          ago: 'now',
        }, ...trades].slice(0, 12);
      }
      // auction countdown
      const auction = s.auction.map(a => ({ ...a, ends: Math.max(0, a.ends - 1) }));
      return {
        ...s, price: p, prevPrice: s.price, history: hist, circuit,
        mining: { ...s.mining, pending, lastTick: now },
        orderBook, trades, auction,
      };
    });
  }, 1000);
};

Object.assign(window, { useStore, getState, setState, actions, startTicker, nf, rnd, clamp, initialState });

</script>

        transition: 'transform 120ms cubic-bezier(.22,1,.36,1), box-shadow 220ms',
        ...style

      onMouseUp={(e) => (e.currentTarget.style.transform = 'scale(1)')}

};

const Chip = ({ tint = 'neutral', children, style }) => {

};

// area sparkline / line chart
const Chart = ({ data, color = '#F5B841', width = 800, height = 220, fill = true, showAxis = false }) => {
  const min = Math.min(...data);
  const max = Math.max(...data);
  const span = Math.max(1, max - min);
  const padTop = 16, padBot = showAxis ? 28 : 8;
  const pts = data.map((v, i) => [
    (i / (data.length - 1)) * width,
    height - ((v - min) / span) * (height - padTop - padBot) - padBot
  ]);
  const d = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const area = `${d} L${width},${height} L0,${height} Z`;
  const id = `chart-${color.replace('#', '')}`;
  const last = pts[pts.length - 1];
  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ overflow: 'visible', display: 'block' }}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity=".45" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {/* grid */}
      {showAxis && [0.25, 0.5, 0.75].map((y, i) => (
        <line key={i} x1="0" y1={padTop + (height - padTop - padBot) * y} x2={width} y2={padTop + (height - padTop - padBot) * y}
          stroke="rgb(255 255 255 / .06)" strokeDasharray="2 4" />
      ))}
      {fill && <path d={area} fill={`url(#${id})`} />}
      <path d={d} stroke={color} strokeWidth="1.75" fill="none" strokeLinejoin="round" strokeLinecap="round" />
      {/* last-price dot */}
      <circle cx={last[0]} cy={last[1]} r="4" fill={color} />
      <circle cx={last[0]} cy={last[1]} r="9" fill={color} opacity="0.2">
        <animate attributeName="r" values="4;14;4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".4;0;.4" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>
  );
};

// Animated value — counts up / flashes on change
const Ticker = ({ value, decimals = 2, prefix = '', suffix = '', style, flashOnChange = true, size = 34 }) => {
  const prev = useRef(value);
  const [flash, setFlash] = useState(null);
  useEffect(() => {
    if (flashOnChange && prev.current !== value) {
      setFlash(value > prev.current ? 'up' : 'down');
      const t = setTimeout(() => setFlash(null), 600);
      prev.current = value;
      return () => clearTimeout(t);
    }
    prev.current = value;
  }, [value, flashOnChange]);
  const c = flash === 'up' ? '#6EE59E' : flash === 'down' ? '#FFB3AE' : '#fff';
  return (
    <span style={{
      fontFamily: 'JetBrains Mono, SF Mono, monospace',
      fontWeight: 700,
      fontSize: size,
      letterSpacing: '-.02em',
      color: c,
      transition: 'color 600ms cubic-bezier(.22,1,.36,1)',
      fontVariantNumeric: 'tabular-nums',
      ...style
    }}>
      {prefix}{nf(value, decimals)}{suffix}
    </span>
  );
};

// Toast

  const rarities = {
    common: { label: 'Common', color: '#9AA2B4', tint: 'neutral' },
    rare: { label: 'Rare', color: '#3A8DFF', tint: 'reserve' },
    legendary: { label: 'Legendary', color: '#F5B841', tint: 'amber' },
    mythic: { label: 'Mythic', color: '#D4B8FF', tint: 'violet' }
  };
  const r = rarities[rarity];
  return <Chip tint={r.tint}>★ {r.label}</Chip>;
};

// Tag cards/items with magnetic hover lift
const Lift = ({ children, amount = 4, style }) => {
  const ref = useRef();
  return (
    <div ref={ref} style={{ transition: 'transform 300ms cubic-bezier(.22,1,.36,1)', ...style }}
      onMouseEnter={(e) => (e.currentTarget.style.transform = `translateY(-${amount}px)`)}
      onMouseLeave={(e) => (e.currentTarget.style.transform = 'translateY(0)')}
    >
      {children}
    </div>
  );
};

// Countdown formatter
const fmtTime = (s) => {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}ч ${m}м`;
  return `${m}:${String(sec).padStart(2, '0')}`;
};

Object.assign(window, {
  Glass, Btn, Chip, Chart, Ticker, Row, Avatar, CoinMark, MapleMark,
  useToasts, ToastStack, RarityBadge, Lift, fmtTime
});

            ['🔔', 'Уведомления', 'Push · email', 'Вкл.'],
            ['🔒', 'Двухфакторная защита', 'Telegram-код', 'Активна'],
            ['💳', 'Способы вывода', '2 карты, 1 кошелёк', '›'],
            ['🎫', 'Реферальная программа', '12 приглашённых · 36 000 MPL', 'COBYA-KLN'],
            ['🌐', 'Язык интерфейса', 'Русский', 'RU / EN'],
            ['🔓', 'Разлогиниться', 'Последний вход: сегодня', '›']
          ].map(([ic, t, sub, tr], i) => (
            <div key={i}>
              <Row leading={<span style={{ fontSize: 22 }}>{ic}</span>} title={t} subtitle={sub}
                trailing={<span style={{ color: '#F5B841', fontSize: 13, fontWeight: 600 }}>{tr}</span>}
                onClick={() => {}} />
              {i < 5 && <div style={{ height: 1, background: 'rgb(255 255 255 / .06)', marginLeft: 16 }} />}
            </div>
          ))}
        </Glass>
      </div>

      {/* Right: promo + referral + activity */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        <Glass tint="violet" style={{ padding: 18 }}>
          <div style={{ fontSize: 14, fontWeight: 700 }}>🎫 Промокод</div>
          <div style={{ fontSize: 12, color: '#D4B8FF', marginTop: 2, marginBottom: 12 }}>Введи код — получи бонус в MPL.</div>
          <input value={promo} onChange={(e) => setPromo(e.target.value)} placeholder="COBYA-..."
            style={{
              width: '100%', padding: '12px 14px', borderRadius: 12,
              background: 'rgb(0 0 0 / .3)', border: '1px solid rgb(255 255 255 / .1)',
              color: '#fff', fontSize: 14, fontFamily: 'JetBrains Mono, monospace',
              outline: 'none', marginBottom: 10, boxSizing: 'border-box'
            }} />
          <Btn tone="amber" style={{ width: '100%' }} onClick={() => {
            const r = actions.redeemPromo(promo);
            if (r.ok) { toast({ emoji: '✅', text: `+${nf(r.bonus)} MPL зачислено.` }); setPromo(''); }
            else toast({ emoji: '❌', text: 'Код не найден.' });
          }}>Активировать</Btn>
          <div style={{ fontSize: 11, color: '#9AA2B4', marginTop: 8, textAlign: 'center' }}>Попробуй: <code style={{ color: '#FFD78C' }}>COBYA26</code></div>
        </Glass>

        <Glass style={{ padding: 18 }}>
          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>🎫 Твоя ссылка</div>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 8,
            padding: '10px 12px', borderRadius: 10,
            background: 'rgb(0 0 0 / .3)', boxShadow: 'inset 0 0 0 1px rgb(255 255 255 / .08)'
          }}>
            <span style={{ flex: 1, fontFamily: 'JetBrains Mono, monospace', fontSize: 12, color: '#FFD78C', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>cobya.coin/r/kln2026</span>
            <button onClick={() => { navigator.clipboard?.writeText('cobya.coin/r/kln2026'); toast({ emoji: '✅', text: 'Ссылка скопирована.' }); }}
              style={{ border: 'none', background: 'rgb(245 184 65 / .22)', color: '#FFE3A6', padding: '6px 10px', borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>Копировать</button>
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 12, fontSize: 12, color: '#9AA2B4' }}>
            <span>Бонус за друга</span><span style={{ color: '#fff', fontWeight: 600 }}>30 000 MPL + 90 CBC</span>
          </div>
        </Glass>

        <Glass style={{ padding: 4, maxHeight: 320, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
          <div style={{ padding: '12px 16px 8px', fontSize: 14, fontWeight: 700 }}>История активности</div>
          <div style={{ flex: 1, overflowY: 'auto' }}>
            {s.feed.slice(0, 12).map(f => (
              <Row key={f.id} leading={<span style={{ fontSize: 18 }}>{f.emoji}</span>}
                title={<span style={{ fontSize: 13, fontWeight: 500 }}>{f.text}</span>}
                subtitle={<span style={{ fontSize: 11 }}>{f.ago}</span>} />
            ))}
          </div>
        </Glass>
      </div>
    </div>
  );
};

Object.assign(window, { Auction, Casino, Leaderboard, Profile });

</script>

<script type="text/babel">
const { useState: useS, useEffect: useE } = React;

// --- TOP TICKER STRIP ---
const TickerStrip = () => {
  const s = useStore();
  const items = [
    { k: 'CBC/MPL', v: nf(s.price, 2), d: '+2.41%', up: true },
    { k: 'Jackpot', v: nf(s.casino.jackpotMpl, 0) + ' MPL', d: '+5%', up: true },
    { k: 'Reserve liq.', v: nf(s.reserve.liquidityMpl / 1000, 0) + 'k MPL', d: '—', up: true },
    { k: 'Active orders', v: s.orderBook.length, d: '', up: true },
    { k: 'Farm hashrate', v: (s.mining.rate * s.mining.gpus * 3600).toFixed(2) + ' CBC/ч', d: '', up: true },
    { k: '@societykolyan', v: '+2.4% PnL', d: '24h', up: true },
    { k: 'Circuit', v: s.circuit ? '🔒 halted' : 'open', d: '', up: !s.circuit },
  ];
  const looped = [...items, ...items, ...items];
  return (
    <div className="ticker-strip">
      <div className="ticker-strip-inner">
        {looped.map((x, i) => (
          <span key={i} style={{ fontSize: 12, color: '#C8CEDB', fontWeight: 500, display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            <span style={{ color: '#9AA2B4' }}>{x.k}</span>
            <span style={{ fontFamily: 'JetBrains Mono, monospace', fontWeight: 700, color: '#fff' }}>{x.v}</span>
            {x.d && <span style={{ color: x.up ? '#9CEBB3' : '#FFB3AE', fontFamily: 'JetBrains Mono, monospace' }}>{x.d}</span>}
            <span style={{ color: '#343B4C' }}>·</span>
          </span>
        ))}
      </div>
    </div>
  );
};

// --- SIDEBAR ---
const Sidebar = ({ active, onChange }) => {
  const s = useStore();
  const items = [
    { k: 'home', icon: '◎', label: 'Главная', sub: 'Обзор' },
    { k: 'trade', icon: '⇅', label: 'Биржа', sub: 'CBC/MPL' },
    { k: 'mine', icon: '⛏', label: 'Майнинг', sub: `${s.mining.gpus} GPU` },
    { k: 'auction', icon: '🎴', label: 'Аукцион', sub: `${s.auction.length} лотов` },
    { k: 'play', icon: '🎰', label: 'Казино', sub: 'Джекпот' },
    { k: 'ranks', icon: '🏆', label: 'Рейтинг', sub: 'Топ-8' },
    { k: 'you', icon: '◐', label: 'Профиль', sub: s.user.handle },
  ];
  return (
    <aside style={{
      position: 'sticky', top: 36, alignSelf: 'start',
      height: 'calc(100vh - 36px)',
      padding: '20px 14px',
      borderRight: '1px solid rgb(255 255 255 / .06)',
      background: 'rgb(6 7 10 / .6)',
      backdropFilter: 'saturate(180%) blur(30px)',
      WebkitBackdropFilter: 'saturate(180%) blur(30px)',
      display: 'flex', flexDirection: 'column', gap: 4,
      overflowY: 'auto'
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 8px 18px' }}>
        <div style={{
          width: 40, height: 40, borderRadius: 10,
          background: 'radial-gradient(circle at 30% 30%, #FFE3A6, #F5B841 55%, #D39110)',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: '#1A0F00', fontWeight: 900, fontSize: 22,
          boxShadow: 'inset 0 2px 4px rgb(255 255 255 / .5), 0 6px 16px rgb(245 184 65 / .4)'
        }}>C</div>
        <div>
          <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: '-.02em' }}>CobyaCoin</div>
          <div style={{ fontSize: 10, color: '#9AA2B4', letterSpacing: '.1em', textTransform: 'uppercase', fontWeight: 700 }}>Pseudo exchange</div>
        </div>
      </div>

      {items.map(i => {
        const on = active === i.k;
        return (
          <button key={i.k} onClick={() => onChange(i.k)} style={{
            display: 'flex', alignItems: 'center', gap: 12,
            padding: '10px 12px', borderRadius: 12,
            background: on ? 'rgb(245 184 65 / .16)' : 'transparent',
            boxShadow: on ? 'inset 0 0 0 1px rgb(245 184 65 / .3)' : 'none',
            border: 'none', cursor: 'pointer', textAlign: 'left',
            color: on ? '#FFE3A6' : '#C8CEDB',
            transition: 'all 220ms'
          }}
          onMouseEnter={e => !on && (e.currentTarget.style.background = 'rgb(255 255 255 / .04)')}
          onMouseLeave={e => !on && (e.currentTarget.style.background = 'transparent')}
          >
            <span style={{ fontSize: 20, width: 24, textAlign: 'center' }}>{i.icon}</span>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 700 }}>{i.label}</div>
              <div style={{ fontSize: 11, color: '#727A8C' }}>{i.sub}</div>
            </div>
            {on && <span style={{ color: '#F5B841', fontWeight: 700 }}>›</span>}
          </button>
        );
      })}

      <div style={{ flex: 1 }} />

      {/* Balance mini */}
      <div style={{
        padding: 14, borderRadius: 14,
        background: 'linear-gradient(135deg, rgb(245 184 65 / .12), rgb(217 67 42 / .12))',
        boxShadow: 'inset 0 0 0 1px rgb(255 255 255 / .08)'
      }}>
        <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '.1em', color: '#9AA2B4', fontWeight: 700 }}>Кошелёк</div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontWeight: 700, fontSize: 17, marginTop: 4 }}>{nf(s.user.cbc)} <span style={{ color: '#F5B841', fontSize: 11 }}>CBC</span></div>
        <div style={{ fontFamily: 'JetBrains Mono, monospace', fontWeight: 600, fontSize: 13, color: '#FFC4B3' }}>{nf(s.user.mpl)} <span style={{ color: '#D9432A', fontSize: 11 }}>MPL</span></div>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 4px', fontSize: 11, color: '#727A8C' }}>
        <span style={{ width: 8, height: 8, borderRadius: 999, background: '#34C759', boxShadow: '0 0 10px #34C759' }} />
        Соединение установлено
      </div>
    </aside>
  );
};

// --- GREETING HEADER ---
const PageHeader = ({ title, sub, right }) => (
  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 18 }}>
    <div>
      <h1 style={{ fontSize: 32, fontWeight: 800, letterSpacing: '-.02em', margin: 0 }}>{title}</h1>
      {sub && <p style={{ color: '#9AA2B4', marginTop: 4, marginBottom: 0 }}>{sub}</p>}
    </div>
    {right}
  </div>
);

// --- APP ---
const App = () => {
  const initial = (localStorage.getItem('cobya:route') || 'home');
  const [route, setRoute] = useS(initial);
  const { toasts, show } = useToasts();
  const s = useStore();

  useE(() => { startTicker(); }, []);
  useE(() => { localStorage.setItem('cobya:route', route); }, [route]);
  // Greeting toast on first load
  useE(() => {
    const seen = sessionStorage.getItem('cobya:greeted');
    if (!seen) {
      setTimeout(() => show({ emoji: '🤖', text: `Привет, ${s.user.handle} — ты в системе CobyaCoin.` }), 400);
      sessionStorage.setItem('cobya:greeted', '1');
    }
  }, []);

  const titles = {
    home: { t: 'Главная', sub: `Добрый вечер, ${s.user.handle}.` },
    trade: { t: 'Биржа', sub: 'Торгуй CBC против кленовых листьев. Курс фиксирует Центробанк.' },
    mine: { t: 'Майнинг', sub: 'Покупай видеокарты, апгрейди ферму, собирай CBC.' },
    auction: { t: 'Аукцион', sub: 'NFT-лоты от игроков.' },
    play: { t: 'Казино', sub: 'Рулетка, подкидной и еженедельный джекпот.' },
    ranks: { t: 'Рейтинг', sub: 'Топ трейдеров и майнеров сети.' },
    you: { t: 'Профиль', sub: 'Настройки, промокоды и реферальная программа.' }
  };
  const tt = titles[route];

  return (
    <>
      <TickerStrip />
      <div className="app-shell" style={{ paddingTop: 36 }}>
        <Sidebar active={route} onChange={setRoute} />
        <main data-screen-label={`${route}`} style={{ padding: '22px 28px 60px', minWidth: 0, animation: 'fadeInUp .3s cubic-bezier(.22,1,.36,1)' }} key={route}>
          {route !== 'auction' && route !== 'ranks' && (
            <PageHeader title={tt.t} sub={tt.sub} right={
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <Chip tint="success">🟢 Рынок открыт</Chip>
                <Btn tone="glass" size="sm">🔔 3</Btn>
              </div>
            } />
          )}
          {route === 'home' && <Dashboard toast={show} goto={setRoute} />}
          {route === 'trade' && <Exchange toast={show} />}
          {route === 'mine' && <Mining toast={show} />}
          {route === 'auction' && <Auction toast={show} />}
          {route === 'play' && <Casino toast={show} />}
          {route === 'ranks' && <Leaderboard />}
          {route === 'you' && <Profile toast={show} />}
        </main>
      </div>
      <ToastStack toasts={toasts} />
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
