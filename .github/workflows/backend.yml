name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cobya
          POSTGRES_PASSWORD: cobya
          POSTGRES_DB: cobya
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.9

      - name: Ruff lint
        run: ruff check app

      - name: Byte-compile
        run: python -m compileall -q app

      - name: Run migrations against Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://cobya:cobya@localhost:5432/cobya
        run: alembic upgrade head

      - name: Smoke-test FastAPI startup
        env:
          DATABASE_URL: postgresql+asyncpg://cobya:cobya@localhost:5432/cobya
          JWT_SECRET: ci-jwt-secret
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18080 &
          SERVER_PID=$!
          # Wait until /healthz returns 200 (max 30s).
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/healthz > /dev/null; then
              echo "server up after ${i}s"
              break
            fi
            sleep 1
          done
          # Hit a handful of public endpoints.
          for path in /healthz /auth/config /market /auction /casino/jackpot /leaderboard; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:18080${path}")
            echo "GET ${path} -> ${code}"
            test "$code" = "200"
          done
          kill $SERVER_PID
